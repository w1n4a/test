<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поймай квадрат!</title>
    <style>
        body { 
            text-align: center; 
            font-family: Arial, sans-serif; 
            background: #1a1a1a; 
            color: white; 
            margin: 0; 
            overflow: hidden; 
        }
        canvas { 
            border: 3px solid #4CAF50; 
            background: #000; 
            display: block; 
            margin: 20px auto; 
            touch-action: none; 
        }
        h1 { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Счёт: <span id="score">0</span></h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <p>Кликай по цветному квадрату!</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');

        let score = 0;
        let target = { x: 0, y: 0, size: 50, color: '#ff4d4d' };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = target.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = target.color;
            ctx.fillRect(target.x, target.y, target.size, target.size);
        }

        function handleInput(e) {
            const rect = canvas.getBoundingClientRect();
            // Поддержка и мышки, и пальца
            const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
            const clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
            
            const mouseX = clientX - rect.left;
            const mouseY = clientY - rect.top;

            if (mouseX >= target.x && mouseX <= target.x + target.size &&
                mouseY >= target.y && mouseY <= target.y + target.size) {
                score++;
                scoreDisplay.innerText = score;
                teleportTarget();
            }
        }

        function teleportTarget() {
            target.x = Math.random() * (canvas.width - target.size);
            target.y = Math.random() * (canvas.height - target.size);
            const colors = ['#ff4d4d', '#4dff88', '#4d94ff', '#ffff4d'];
            target.color = colors[Math.floor(Math.random() * colors.length)];
        }

        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleInput(e);
        });

        // ЗАПУСК
        teleportTarget(); // Сначала создаем квадрат
        function gameLoop() {
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop(); // Потом запускаем отрисовку
    </script>
</body>
</html>
